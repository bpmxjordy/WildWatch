{% extends "base.html" %}
{% block title %}Image Inference — WildSight{% endblock %}

{% block content %}
<div x-data="inferencePage()" x-init="init()">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="font-serif text-3xl font-bold tracking-tight">Image Inference</h1>
      <p class="text-muted text-sm mt-1">Upload an image and run detection with any loaded model</p>
    </div>
  </div>

  <div class="grid lg:grid-cols-3 gap-6">
    <!-- Upload + Controls (1/3) -->
    <div class="space-y-4">
      <!-- Model selector -->
      <div class="bg-white rounded-xl border border-rule p-5">
        <h2 class="font-serif text-lg font-semibold mb-3">Model</h2>
        <select x-model="selectedModelId"
                class="w-full px-3 py-2 border border-rule rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-forest-300">
          <option value="">Select a model...</option>
          <template x-for="m in models" :key="m.id">
            <option :value="m.id" x-text="m.name + (m.is_builtin ? '' : ' (' + m.framework + ')')"></option>
          </template>
        </select>
      </div>

      <!-- Image upload -->
      <div class="bg-white rounded-xl border border-rule p-5">
        <h2 class="font-serif text-lg font-semibold mb-3">Image</h2>
        <div class="border-2 border-dashed border-rule rounded-lg p-6 text-center hover:border-forest-300 transition-colors cursor-pointer"
             @dragover.prevent="dragging = true"
             @dragleave.prevent="dragging = false"
             @drop.prevent="handleDrop($event)"
             :class="{ 'border-forest-400 bg-forest-50/30': dragging }"
             @click="$refs.fileInput.click()">
          <input type="file" x-ref="fileInput" accept="image/*" class="hidden" @change="handleFile($event)">
          <template x-if="!previewUrl">
            <div>
              <svg class="w-10 h-10 mx-auto mb-2 text-muted opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <p class="text-sm text-muted">Drop an image here or click to browse</p>
              <p class="text-[10px] text-muted mt-1">JPG, PNG, WebP</p>
            </div>
          </template>
          <template x-if="previewUrl">
            <div>
              <img :src="previewUrl" class="max-h-40 mx-auto rounded-lg mb-2">
              <p class="text-xs text-muted" x-text="fileName"></p>
            </div>
          </template>
        </div>
      </div>

      <!-- Run button -->
      <button @click="runInference()" :disabled="!selectedModelId || !selectedFile || loading"
              class="w-full px-5 py-3 bg-forest-600 text-white text-sm font-medium rounded-xl hover:bg-forest-700 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <template x-if="loading">
          <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </template>
        <span x-text="loading ? 'Running inference...' : 'Run Detection'"></span>
      </button>

      <!-- Results list -->
      <div x-show="results.length > 0" class="bg-white rounded-xl border border-rule overflow-hidden">
        <div class="px-4 py-3 border-b border-rule bg-gray-50">
          <h3 class="text-sm font-semibold" x-text="results.length + ' Detection(s)'"></h3>
        </div>
        <div class="divide-y divide-rule">
          <template x-for="(det, i) in results" :key="i">
            <div class="px-4 py-3 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full" :style="'background:' + getColor(i)"></span>
                <span class="text-sm font-medium" x-text="det.class_name"></span>
              </div>
              <span class="px-2 py-0.5 bg-forest-50 text-forest-700 text-xs rounded font-mono"
                    x-text="(det.confidence * 100).toFixed(1) + '%'"></span>
            </div>
          </template>
        </div>
      </div>

      <div x-show="ranOnce && results.length === 0 && !loading" class="bg-white rounded-xl border border-rule p-5 text-center">
        <p class="text-sm text-muted">No detections found in this image</p>
      </div>
    </div>

    <!-- Result image (2/3) -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl border border-rule overflow-hidden">
        <div class="aspect-video bg-gray-100 flex items-center justify-center relative">
          <template x-if="!annotatedUrl && !previewUrl">
            <div class="text-center">
              <svg class="w-16 h-16 mx-auto mb-3 text-muted opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              <p class="text-sm text-muted">Upload an image and select a model to begin</p>
            </div>
          </template>
          <template x-if="previewUrl && !annotatedUrl">
            <img :src="previewUrl" class="max-w-full max-h-full object-contain">
          </template>
          <template x-if="annotatedUrl">
            <img :src="showAnnotated ? annotatedUrl : originalUrl" class="max-w-full max-h-full object-contain">
          </template>
          <template x-if="loading">
            <div class="absolute inset-0 bg-black/30 flex items-center justify-center backdrop-blur-sm">
              <div class="text-center text-white">
                <svg class="animate-spin w-8 h-8 mx-auto mb-2" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <p class="text-sm font-medium">Analyzing image...</p>
              </div>
            </div>
          </template>
        </div>
        <div class="px-4 py-2 border-t border-rule flex items-center justify-between" x-show="annotatedUrl">
          <span class="text-[10px] font-mono text-muted" x-text="'Model: ' + (models.find(m => m.id === selectedModelId)?.name || '')"></span>
          <div class="flex gap-2">
            <button @click="toggleView()" class="text-xs text-forest-600 hover:text-forest-700 font-medium"
                    x-text="showAnnotated ? 'Show Original' : 'Show Detections'"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const BACKEND = '{{ backend_url }}';
const COLORS = ['#2d7d2d','#0d9488','#1565c0','#6a1b9a','#ad1457','#e65100','#3e2723','#263238'];

function inferencePage() {
  return {
    models: [],
    selectedModelId: '',
    selectedFile: null,
    fileName: '',
    previewUrl: null,
    annotatedUrl: null,
    originalUrl: null,
    results: [],
    loading: false,
    ranOnce: false,
    dragging: false,
    showAnnotated: true,

    async init() {
      try {
        const res = await fetch(`${BACKEND}/api/v1/models`);
        this.models = await res.json();
      } catch (e) { console.error(e); }
    },

    handleFile(e) {
      const file = e.target.files[0];
      if (file) this.setFile(file);
    },

    handleDrop(e) {
      this.dragging = false;
      const file = e.dataTransfer.files[0];
      if (file) this.setFile(file);
    },

    setFile(file) {
      this.selectedFile = file;
      this.fileName = file.name;
      this.previewUrl = URL.createObjectURL(file);
      this.annotatedUrl = null;
      this.results = [];
      this.ranOnce = false;
    },

    async runInference() {
      if (!this.selectedFile || !this.selectedModelId) return;
      this.loading = true;
      this.results = [];
      this.annotatedUrl = null;

      const formData = new FormData();
      formData.append('file', this.selectedFile);
      formData.append('model_id', this.selectedModelId);

      try {
        const res = await fetch(`${BACKEND}/api/v1/inference`, { method: 'POST', body: formData });
        const data = await res.json();
        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          this.results = data.detections || [];
          this.originalUrl = `${BACKEND}${data.image_url}`;
          this.annotatedUrl = `${BACKEND}${data.annotated_url}`;
          this.showAnnotated = true;
        }
      } catch (e) {
        alert('Inference failed: ' + e.message);
      }
      this.loading = false;
      this.ranOnce = true;
    },

    toggleView() {
      this.showAnnotated = !this.showAnnotated;
    },

    getColor(i) { return COLORS[i % COLORS.length]; },
  }
}
</script>
{% endblock %}
