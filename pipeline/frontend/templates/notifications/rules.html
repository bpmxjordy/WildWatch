{% extends "base.html" %}
{% block title %}Notifications — {{ project.name }} — WildSight{% endblock %}

{% block content %}
<div x-data="notifPage()" x-init="init()">
  <a href="/projects/{{ project.id }}" class="inline-flex items-center gap-1 text-sm text-muted hover:text-ink transition-colors mb-4">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
    </svg>
    Back to Project
  </a>

  <div class="flex items-center justify-between mb-6">
    <h1 class="font-serif text-2xl font-bold tracking-tight">Notification Rules</h1>
    <button @click="showForm = !showForm"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-forest-700 bg-forest-50 rounded-lg hover:bg-forest-100 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Add Rule
    </button>
  </div>

  <!-- Add rule form -->
  <div x-show="showForm" x-transition class="bg-white rounded-xl border border-rule p-5 mb-6">
    <h3 class="font-serif text-lg font-semibold mb-4">New Notification Rule</h3>
    <form @submit.prevent="createRule()" class="space-y-4">
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1.5">Channel</label>
          <select x-model="newRule.channel" class="w-full px-3 py-2 border border-rule rounded-lg text-sm bg-white">
            <option value="email">Email</option>
            <option value="webhook">Webhook</option>
            <option value="browser">Browser Push</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Destination</label>
          <input type="text" x-model="newRule.destination"
                 :placeholder="newRule.channel === 'email' ? 'you@example.com' : newRule.channel === 'webhook' ? 'https://hooks.example.com/...' : 'browser'"
                 class="w-full px-3 py-2 border border-rule rounded-lg text-sm bg-white">
        </div>
      </div>
      <div class="grid sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1.5">Min Confidence</label>
          <input type="number" x-model="newRule.min_confidence" min="0" max="1" step="0.05"
                 class="w-full px-3 py-2 border border-rule rounded-lg text-sm font-mono bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Cooldown (seconds)</label>
          <input type="number" x-model="newRule.cooldown_seconds" min="0"
                 class="w-full px-3 py-2 border border-rule rounded-lg text-sm font-mono bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Stream <span class="text-muted">(optional)</span></label>
          <select x-model="newRule.stream_id" class="w-full px-3 py-2 border border-rule rounded-lg text-sm bg-white">
            <option value="">All streams</option>
            {% for stream in streams %}
            <option value="{{ stream.id }}">{{ stream.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">Species Filter <span class="text-muted">(comma-separated, blank = all)</span></label>
        <input type="text" x-model="newRule.species_filter_text" placeholder="bear, eagle, deer"
               class="w-full px-3 py-2 border border-rule rounded-lg text-sm bg-white">
      </div>
      <div class="flex gap-2">
        <button type="submit" class="px-4 py-2 bg-forest-600 text-white text-sm font-medium rounded-lg hover:bg-forest-700 transition-colors">Create Rule</button>
        <button type="button" @click="showForm = false" class="px-4 py-2 text-sm text-muted hover:text-ink transition-colors">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Rules list -->
  <div class="bg-white rounded-xl border border-rule overflow-hidden">
    <template x-if="rules.length > 0">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-rule">
          <tr>
            <th class="text-left px-4 py-2 font-medium text-muted text-xs">Channel</th>
            <th class="text-left px-4 py-2 font-medium text-muted text-xs">Destination</th>
            <th class="text-left px-4 py-2 font-medium text-muted text-xs">Species</th>
            <th class="text-left px-4 py-2 font-medium text-muted text-xs">Min Conf.</th>
            <th class="text-left px-4 py-2 font-medium text-muted text-xs">Cooldown</th>
            <th class="text-left px-4 py-2 font-medium text-muted text-xs">Active</th>
            <th class="text-right px-4 py-2 font-medium text-muted text-xs"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-rule">
          <template x-for="rule in rules" :key="rule.id">
            <tr class="hover:bg-gray-50/50">
              <td class="px-4 py-2.5">
                <span class="px-2 py-0.5 rounded-md text-[10px] font-mono uppercase"
                      :class="rule.channel === 'email' ? 'bg-blue-50 text-blue-700' : rule.channel === 'webhook' ? 'bg-purple-50 text-purple-700' : 'bg-amber-50 text-amber-700'"
                      x-text="rule.channel"></span>
              </td>
              <td class="px-4 py-2.5 font-mono text-xs truncate max-w-[200px]" x-text="rule.destination"></td>
              <td class="px-4 py-2.5 text-xs text-muted" x-text="rule.species_filter.length ? rule.species_filter.join(', ') : 'All'"></td>
              <td class="px-4 py-2.5 font-mono text-xs" x-text="(rule.min_confidence * 100).toFixed(0) + '%'"></td>
              <td class="px-4 py-2.5 font-mono text-xs" x-text="rule.cooldown_seconds + 's'"></td>
              <td class="px-4 py-2.5">
                <button @click="toggleRule(rule)" class="w-8 h-5 rounded-full transition-colors relative"
                        :class="rule.is_active ? 'bg-forest-500' : 'bg-gray-300'">
                  <span class="absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform"
                        :class="rule.is_active ? 'left-3.5' : 'left-0.5'"></span>
                </button>
              </td>
              <td class="px-4 py-2.5 text-right">
                <button @click="deleteRule(rule.id)" class="text-red-500 hover:text-red-700 text-xs">Delete</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
    <template x-if="rules.length === 0">
      <div class="p-12 text-center">
        <svg class="w-10 h-10 mx-auto mb-2 text-muted opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <p class="text-sm text-muted">No notification rules configured</p>
        <p class="text-xs text-muted mt-1">Add a rule to get alerts when species are detected</p>
      </div>
    </template>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const BACKEND = '{{ backend_url }}';
const PROJECT_ID = '{{ project.id }}';

function notifPage() {
  return {
    rules: [],
    showForm: false,
    newRule: { channel: 'email', destination: '', min_confidence: 0.5, cooldown_seconds: 300, stream_id: '', species_filter_text: '' },

    async init() { await this.fetchRules(); },

    async fetchRules() {
      const res = await fetch(`${BACKEND}/api/v1/projects/${PROJECT_ID}/notifications`);
      this.rules = await res.json();
    },

    async createRule() {
      const sf = this.newRule.species_filter_text
        ? this.newRule.species_filter_text.split(',').map(s => s.trim()).filter(Boolean)
        : [];
      const body = {
        channel: this.newRule.channel,
        destination: this.newRule.channel === 'browser' ? 'browser' : this.newRule.destination,
        min_confidence: parseFloat(this.newRule.min_confidence),
        cooldown_seconds: parseInt(this.newRule.cooldown_seconds),
        species_filter: sf,
      };
      if (this.newRule.stream_id) body.stream_id = this.newRule.stream_id;

      await fetch(`${BACKEND}/api/v1/projects/${PROJECT_ID}/notifications`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      this.showForm = false;
      this.newRule = { channel: 'email', destination: '', min_confidence: 0.5, cooldown_seconds: 300, stream_id: '', species_filter_text: '' };
      await this.fetchRules();
    },

    async toggleRule(rule) {
      await fetch(`${BACKEND}/api/v1/notifications/${rule.id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_active: !rule.is_active })
      });
      await this.fetchRules();
    },

    async deleteRule(id) {
      if (!confirm('Delete this notification rule?')) return;
      await fetch(`${BACKEND}/api/v1/notifications/${id}`, { method: 'DELETE' });
      await this.fetchRules();
    }
  }
}
</script>
{% endblock %}
