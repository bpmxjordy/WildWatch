{% extends "base.html" %}
{% block title %}Map — {{ project.name }} — WildSight{% endblock %}

{% block head %}
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
  .leaflet-popup-content { min-width: 200px; }
  .cam-popup-thumb { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background: #f3f4f6; }
</style>
{% endblock %}

{% block content %}
<div x-data="mapPage()" x-init="init()">
  <a href="/projects/{{ project.id }}" class="inline-flex items-center gap-1 text-sm text-muted hover:text-ink transition-colors mb-4">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
    </svg>
    Back to Project
  </a>

  <div class="flex items-center justify-between mb-4">
    <h1 class="font-serif text-2xl font-bold tracking-tight">Camera Map</h1>
    <div class="flex items-center gap-4">
      <!-- Layer toggles -->
      <div class="flex items-center gap-2 bg-white border border-rule rounded-lg p-0.5">
        <button @click="toggleMarkers()" class="px-2.5 py-1 rounded-md text-xs font-medium transition-colors"
                :class="showMarkers ? 'bg-forest-600 text-white' : 'text-muted hover:bg-gray-100'">Markers</button>
        <button @click="toggleHeatmap()" class="px-2.5 py-1 rounded-md text-xs font-medium transition-colors"
                :class="showHeatmap ? 'bg-red-500 text-white' : 'text-muted hover:bg-gray-100'">Heatmap</button>
      </div>
      <!-- Legend -->
      <div class="flex items-center gap-3 text-xs">
        <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-green-400"></span> Running</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Idle</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-400"></span> Offline</span>
      </div>
    </div>
  </div>

  <div id="project-map" class="h-[600px] rounded-xl border border-rule z-0"></div>

  <!-- Activity summary below map -->
  <div class="mt-4 grid sm:grid-cols-3 gap-3" x-show="heatmapData.points.length > 0">
    <template x-for="pt in heatmapData.points.sort((a,b) => b.count - a.count).slice(0, 6)" :key="pt.stream_id">
      <div class="bg-white rounded-xl border border-rule p-3 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium" x-text="pt.name"></p>
          <p class="text-[10px] text-muted font-mono" x-text="pt.lat.toFixed(2) + ', ' + pt.lng.toFixed(2)"></p>
        </div>
        <div class="text-right">
          <p class="text-lg font-bold text-forest-700" x-text="pt.count"></p>
          <p class="text-[10px] text-muted">detections</p>
        </div>
      </div>
    </template>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const STREAMS = {{ streams_json | safe }};
const BACKEND = '{{ backend_url }}';
const PROJECT_ID = '{{ project.id }}';

function mapPage() {
  return {
    map: null,
    markerLayer: null,
    heatLayer: null,
    showMarkers: true,
    showHeatmap: true,
    heatmapData: { points: [] },

    async init() {
      await this.fetchHeatmap();
      this.initMap();
    },

    async fetchHeatmap() {
      try {
        const res = await fetch(`${BACKEND}/api/v1/projects/${PROJECT_ID}/analytics/heatmap?range=7d`);
        this.heatmapData = await res.json();
      } catch (e) { console.error(e); }
    },

    initMap() {
      const withCoords = STREAMS.filter(s => s.latitude && s.longitude);
      let center = [20, 0], zoom = 2;
      if (withCoords.length === 1) {
        center = [withCoords[0].latitude, withCoords[0].longitude]; zoom = 10;
      } else if (withCoords.length > 1) {
        const lats = withCoords.map(s => s.latitude), lngs = withCoords.map(s => s.longitude);
        center = [(Math.min(...lats)+Math.max(...lats))/2, (Math.min(...lngs)+Math.max(...lngs))/2]; zoom = 4;
      }

      this.map = L.map('project-map', { zoomControl: false }).setView(center, zoom);
      L.control.zoom({ position: 'topright' }).addTo(this.map);

      // Dark Palantir-style base layer
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd', maxZoom: 19,
      }).addTo(this.map);

      // Marker layer — bright colors for dark map
      const statusColors = { running: '#4ade80', idle: '#fbbf24', error: '#f87171', offline: '#f87171' };
      this.markerLayer = L.layerGroup();
      const countsMap = {};
      this.heatmapData.points.forEach(p => { countsMap[p.stream_id] = p.count; });

      withCoords.forEach(s => {
        const color = statusColors[s.status] || '#9ca3af';
        const count = countsMap[s.id] || 0;
        const icon = L.divIcon({
          className: '',
          html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.8);box-shadow:0 0 8px ${color}, 0 0 16px ${color}44;"></div>`,
          iconSize: [14, 14], iconAnchor: [7, 7],
        });
        const popup = `
          <img src="${BACKEND}/frames/${s.id}.jpg" class="cam-popup-thumb" onerror="this.style.display='none'">
          <div style="font-weight:600;font-size:13px;">${s.name}</div>
          <div style="font-size:11px;color:#6b7280;">${s.location_name || ''}</div>
          <div style="font-size:10px;margin-top:4px;">
            <span style="color:${color};font-weight:600;text-transform:uppercase;font-size:9px;letter-spacing:0.05em;">${s.status}</span>
            <span style="color:#9ca3af;margin:0 4px;">&middot;</span>
            <span style="font-weight:600;color:#4ade80;">${count} detections</span>
          </div>
          <a href="/streams/${s.id}" style="display:inline-block;margin-top:6px;font-size:11px;color:#4ade80;font-weight:500;">View details &rarr;</a>`;
        L.marker([s.latitude, s.longitude], { icon }).bindPopup(popup, { maxWidth: 260 }).addTo(this.markerLayer);
      });
      this.markerLayer.addTo(this.map);

      // Heatmap layer
      const heatPoints = this.heatmapData.points
        .filter(p => p.count > 0)
        .map(p => [p.lat, p.lng, p.count]);
      if (heatPoints.length > 0) {
        this.heatLayer = L.heatLayer(heatPoints, {
          radius: 40, blur: 30, maxZoom: 12, minOpacity: 0.3,
          gradient: { 0.1: '#0a2f1f', 0.3: '#166534', 0.5: '#22c55e', 0.7: '#fbbf24', 0.9: '#ef4444', 1.0: '#ff2222' },
        });
        this.heatLayer.addTo(this.map);
      }

      if (withCoords.length > 1) {
        this.map.fitBounds(L.latLngBounds(withCoords.map(s => [s.latitude, s.longitude])), { padding: [40, 40] });
      }
    },

    toggleMarkers() {
      this.showMarkers = !this.showMarkers;
      if (this.showMarkers) this.markerLayer.addTo(this.map);
      else this.map.removeLayer(this.markerLayer);
    },

    toggleHeatmap() {
      this.showHeatmap = !this.showHeatmap;
      if (!this.heatLayer) return;
      if (this.showHeatmap) this.heatLayer.addTo(this.map);
      else this.map.removeLayer(this.heatLayer);
    },
  }
}
</script>
{% endblock %}
